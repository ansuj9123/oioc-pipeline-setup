name: terraform-sandpit-pipeline

on:
    push:
        branches: [ "**" ]
        paths:
            - "environments/**"
            - "modules/**"
            - ".github/workflows/terraform-plan.yml"
    pull_request:
        branches: [ "**" ]
        paths:
            - "environments/**"
            - "modules/**"
            - ".github/workflows/terraform-plan.yml"

permissions:
    id-token: write
    contents: read

concurrency:
    group: terraform-sandpit
    cancel-in-progress: false

env:
    ARM_USE_OIDC: true
    ARM_USE_AZUREAD: true
    # These secrets are used by both Azure Login and the Terraform Provider
    ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
    ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
    ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
    TF_IN_AUTOMATION: true

jobs:
    plan:
        runs-on: ubuntu-latest
        environment: sandpit
        defaults:
            run:
                working-directory: environments/sandpit

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup Terraform
              uses: hashicorp/setup-terraform@v3

            - name: Azure CLI Login
              uses: azure/login@v2
              with:
                  client-id: ${{ env.ARM_CLIENT_ID }}
                  tenant-id: ${{ env.ARM_TENANT_ID }}
                  subscription-id: ${{ env.ARM_SUBSCRIPTION_ID }}

            - name: Terraform Init
              run: terraform init -backend-config=backend.hcl -input=false

            - name: Terraform Validate
              run: terraform validate

            - name: Terraform Plan
              run: terraform plan -out=tfplan

            - name: Upload plan artifact
              uses: actions/upload-artifact@v4
              with:
                  name: tfplan-sandpit
                  path: environments/sandpit/tfplan

    apply:
        needs: plan
        if: github.event_name == 'push'
        runs-on: ubuntu-latest
        environment: sandpit
        defaults:
            run:
                working-directory: environments/sandpit

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup Terraform
              uses: hashicorp/setup-terraform@v3

            - name: Azure CLI Login
              uses: azure/login@v2
              with:
                  client-id: ${{ env.ARM_CLIENT_ID }}
                  tenant-id: ${{ env.ARM_TENANT_ID }}
                  subscription-id: ${{ env.ARM_SUBSCRIPTION_ID }}

            - name: Download plan artifact
              uses: actions/download-artifact@v4
              with:
                  name: tfplan-sandpit
                  path: environments/sandpit

            - name: Terraform Init
              run: terraform init -backend-config=backend.hcl -input=false

            - name: Terraform Apply
              run: terraform apply -auto-approve -input=false tfplan
